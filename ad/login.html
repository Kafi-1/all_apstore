<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login - Play Store</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-logo">▶</div>
      <h1>Play Store Admin</h1>
      <p>Sign in to manage your app marketplace</p>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" required placeholder="admin@example.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" required placeholder="••••••••" />
      </div>
      <div id="login-error" class="error-text"></div>
      <button type="submit" class="btn btn-primary btn-full" id="login-btn">Sign In</button>
    </form>

    <p class="login-footer">Not authorized? Contact the site owner.</p>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
